services:
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: unless-stopped
    networks:
      - media_network
    dns:
      - 8.8.8.8
      - 1.1.1.1
    ports:
      - "3090:80"
    environment:
      - TZ=America/Los_Angeles
    volumes:
      - /opt/stacks/vaultwarden/data:/data

networks:
  media_network:
    external: true