services:
  plex:
    image: ghcr.io/linuxserver/plex:latest
    container_name: plex
    network_mode: host
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Los_Angeles
      - VERSION=docker
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - ./config/plex:/config
      - /mnt/media/data/movies:/data/movies
      - /mnt/media/data/tv:/data/tv
      - /mnt/media/data/music:/data/music
      - /mnt/media/data/comedy:/data/comedy
      - /mnt/media/data/anime:/data/anime
      - /mnt/media/data/youtube:/data/youtube
      - /mnt/media/data/personal:/data/personal
      - ./transcode:/transcode
    restart: unless-stopped

  tautulli:
    image: ghcr.io/tautulli/tautulli:latest
    container_name: tautulli
    ports:
      - 8181:8181
    volumes:
      - ./config/tautulli:/config
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Los_Angeles
    restart: unless-stopped
    networks:
      - media_network

networks:
  media_network:
    external: true
