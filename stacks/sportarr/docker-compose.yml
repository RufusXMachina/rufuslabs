services:
  sportarr:
    image: sportarr/sportarr:latest
    container_name: sportarr
    networks:
      - media_network
    dns:
      - 8.8.8.8
      - 1.1.1.1
    ports:
      - 1867:1867
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Los_Angeles
    volumes:
      - ./config/sportarr:/config
      - /mnt/media/data:/data
    restart: unless-stopped

networks:
  media_network:
    external: true