tls:
  enabled: false

auth:
  enabled: false

mqtt:
  enabled: true
  host: 127.0.0.1
  port: 1883

networking:
  listen:
    internal: 5003
    external: 8971

go2rtc:
  api:
    listen: ":1985"
  rtsp:
    listen: ":8557"
  webrtc:
    listen: ":8558"

model:
  width: 300
  height: 300

detectors:
  ov:
    type: openvino
    device: GPU

ffmpeg:
  hwaccel_args: preset-vaapi

cameras:
  front_porch:
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8556/front-porch-cam_lan
          input_args: preset-rtsp-restream
          roles:
            - detect
            - record
    detect:
      enabled: true
      width: 1920
      height: 1080
      fps: 5
    objects:
      track:
        - person
        - dog
        - cat
        - car
    record:
      enabled: true
      alerts:
        retain:
          days: 14
      detections:
        retain:
          days: 14
      continuous:
        days: 0
      motion:
        days: 7
    snapshots:
      enabled: true
      retain:
        default: 14
version: 0.18-0
