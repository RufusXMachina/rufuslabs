services:
  lidarr:
    image: ghcr.io/linuxserver/lidarr:latest
    container_name: lidarr
    networks:
      - media_network
    ports:
      - 8686:8686
    env_file:
      - /opt/stacks/common.env
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ./config:/config
      - /mnt/media/data:/data
    restart: unless-stopped

networks:
  media_network:
    external: true
